# docker-compose.yml -> ./docker-compose.yml
networks:
  mysql-server:
    driver: bridge

services:
  # backend servive (server)
  server:
    container_name: server
    build: ./backend
    restart: always
    networks:
      - mysql-server
    expose:
      - 5000
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/env/.env
    depends_on:
      mysql:
        condition: service_healthy

  # mysql service (database)
  mysql:
    container_name: mysql
    image: mysql:8.0
    restart: always
    networks:
      - mysql-server
    ports:
      - 3306
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$MYSQL_ROOT_PASSWORD",
        ]
      interval: 30s
      timeout: 10s
      retries: 50
